<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <title>Google</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body {
        height: 100%;
        background: #fff;
        font-family: Arial, "Roboto", "Helvetica Neue", sans-serif;
        color: #202124;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Верхняя панель: аккаунт справа */
      header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 14px 18px;
      }
      .account {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #1a73e8;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Основной блок по центру */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 22px;
        margin-top: 24vh;
      }
      #google-logo {
        width: 180px;
        max-width: 60vw;
        margin-bottom: 28px;
      }

      /* Поисковая строка-пилюля */
      form { width: 100%; max-width: 460px; }
      .search-box {
        display: flex;
        align-items: center;
        width: 100%;
        height: 48px;
        border: 1px solid #dfe1e5;
        border-radius: 24px;
        padding: 0 16px;
        box-shadow: none;
        transition: box-shadow .2s;
      }
      .search-box:focus-within {
        box-shadow: 0 1px 6px rgba(32,33,36,.28);
        border-color: rgba(223,225,229,0);
      }
      .search-box .lead-icon { flex: 0 0 auto; color: #9aa0a6; display: flex; }
      .search-box input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        padding: 0 12px;
        background: transparent;
        color: #202124;
      }
      .search-box .trail-icons { display: flex; gap: 16px; flex: 0 0 auto; }
      .search-box .trail-icons svg { display: block; }

      /* Кнопки */
      .buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 26px;
        flex-wrap: wrap;
      }
      .buttons button {
        background: #f8f9fa;
        border: 1px solid #f8f9fa;
        border-radius: 4px;
        color: #3c4043;
        font-size: 14px;
        padding: 10px 16px;
        cursor: pointer;
      }
      .buttons button:hover { border-color: #dadce0; box-shadow: 0 1px 1px rgba(0,0,0,.1); }

      footer {
        padding: 16px;
        text-align: center;
        color: #70757a;
        font-size: 12px;
      }
      footer a { color: #70757a; text-decoration: none; margin: 0 8px; }
    </style>
  </head>
  <body>
    <header>
      <div class="account" title="Google Account: John Doe (404@gmail.com)">J</div>
    </header>

    <main>
      <img src="assets/logo-google.png" alt="Google" id="google-logo" />
      <form action="#" method="post">
        <div class="search-box">
          <span class="lead-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input id="search-input" class="type-js" type="text" name="query" value="" autocomplete="off" />
          <div class="trail-icons">
            <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path fill="#34A853" d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
            <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path fill="#EA4335" d="M9 3L7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 14.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
          </div>
        </div>
        <div class="buttons">
          <button type="button" name="go-search">Google Search</button>
          <button type="button" name="im-feeling">I'm Feeling Lucky</button>
        </div>
      </form>
    </main>

    <footer>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Settings</a>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let letter = 0;
        const params = new URLSearchParams(window.location.search);
        let rawUrl = params.get('to_raw');
        let url = params.get('to');
        let text = params.get('q');

        if (url === null) url = text;
        if (text === null) return; // без ?q скрипт просто ничего не печатает

        const input = document.getElementsByClassName("type-js")[0];

        function typeText() {
          if (letter < text.length) {
            input.value += text.charAt(letter);
            letter++;
            let speed = Math.floor(Math.random() * 120) + 50;
            setTimeout(typeText, speed);
          } else {
            if (!!rawUrl) {
              setTimeout(() => { window.location.href = rawUrl; }, 1000);
            } else {
              setTimeout(() => { window.location.href = "https://www.google.com/search?q=" + url; }, 1000);
            }
          }
        }
        typeText();
      });
    </script>
  </body>
</html>
